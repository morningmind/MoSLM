[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moslm"
version = "0.1.0"
description = "MoSLM: orchestrate specialized small language models as tools"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
eval = ["datasets>=2.18"]
dev = ["pytest>=7"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
gemini = ["google-genai>=1.0"]
litellm = ["litellm>=1.0"]
providers = ["openai>=1.0", "anthropic>=0.25", "google-genai>=1.0"]

[tool.setuptools.packages.find]
include = ["moslm*"]
